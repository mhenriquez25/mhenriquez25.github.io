<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Try the Look · Moda Casual</title>
  
  <!-- Tipografía moderna Inter & FontAwesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* =========================================================
       1. VARIABLES Y RESET MINIMALISTA PREMIUM
    ========================================================= */
    :root {
      --bg-body: #f4f4f2;
      --bg-stage: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #f4f4f2 68%, #e8e8e4 100%);
      --text-main: #121212;
      --text-muted: #737373;
      --text-light: #a3a3a3;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --card-glass: rgba(255, 255, 255, 0.94);
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --anim-time: 600ms;
      --font-inter: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-inter);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================================
       2. NAVEGACIÓN SUPERIOR MINIMALISTA
    ========================================================= */
    .site-nav {
      width: 100%;
      max-width: 1560px;
      margin: 0 auto;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 50;
    }

    .brand-logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      background: var(--text-main);
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      letter-spacing: 0.2px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .bag-icon-btn {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      position: relative;
      transition: all 0.25s var(--ease-smooth);
    }

    .bag-icon-btn:hover {
      background: var(--text-main);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .bag-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--text-main);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bag-icon-btn:hover .bag-badge {
      background: #ffffff;
      color: var(--text-main);
      border-color: var(--text-main);
    }

    /* =========================================================
       3. ESTRUCTURA HERO: TRY THE LOOK
    ========================================================= */
    .hero-layout {
      flex: 1;
      width: 100%;
      max-width: 1560px;
      margin: 0 auto;
      padding: 10px 40px 40px 40px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 36px;
      position: relative;
    }

    .stage-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      min-height: 640px;
    }

    /* Header superior izquierdo */
    .hero-header {
      margin-bottom: 16px;
      animation: entranceHeader 0.7s var(--ease-smooth) forwards;
    }

    .hero-title {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.8px;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.1px;
    }

    /* =========================================================
       4. ESCENARIO DEL CARRUSEL CENTRAL (PERSPECTIVA 3D)
    ========================================================= */
    .carousel-stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 24px;
      background: var(--bg-stage);
      touch-action: pan-y;
      user-select: none;
      cursor: grab;
      min-height: 530px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 20px 48px -24px rgba(0, 0, 0, 0.06);
    }

    .carousel-stage.is-dragging {
      cursor: grabbing;
    }

    /* Luz de estudio central */
    .stage-ambient-light {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 72%);
      pointer-events: none;
      z-index: 1;
    }

    /* Pista donde se colocan los modelos */
    .carousel-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 24px;
      pointer-events: none;
    }

    /* Tarjeta individual del modelo */
    .model-card {
      position: absolute;
      bottom: 20px;
      width: 260px;
      height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: auto;
      cursor: pointer;
      transition: transform var(--anim-time) var(--ease-smooth),
                  opacity var(--anim-time) var(--ease-smooth),
                  filter var(--anim-time) var(--ease-smooth);
      will-change: transform, opacity, filter;
    }

    /* Animación de entrada escalonada al cargar */
    .model-card.anim-entrance {
      animation: modelEntrance 0.8s var(--ease-smooth) backwards;
    }

    .model-figure-container {
      width: 100%;
      height: 440px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .model-3d-base-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.18));
      transition: filter 0.35s ease, transform 0.35s ease;
    }

    /* SVG de la camiseta ajustada sobre el torso del modelo 3D */
    .model-3d-tshirt-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Sombra suave de contacto en el suelo */
    .model-floor-shadow {
      width: 180px;
      height: 22px;
      background: radial-gradient(ellipse at center, rgba(18, 18, 18, 0.32) 0%, rgba(18, 18, 18, 0) 70%);
      border-radius: 50%;
      margin-top: -8px;
      transition: transform var(--anim-time) var(--ease-smooth),
                  opacity var(--anim-time) var(--ease-smooth);
      pointer-events: none;
    }

    /* =========================================================
       ESTADOS DEL MODELO EN LA PASARELA SEGÚN PROFUNDIDAD
       (Centro: activo 100%, lados: scale 0.8-0.7, opacity 0.4-0.2, blur 2-6px, desaturado)
    ========================================================= */
    .model-card[data-depth="0"] {
      z-index: 10;
      transform: translateX(0) scale(1);
      opacity: 1;
      filter: blur(0px) grayscale(0%) brightness(1);
    }
    .model-card[data-depth="0"] .model-3d-base-img {
      filter: drop-shadow(0 20px 32px rgba(0, 0, 0, 0.24));
    }
    .model-card[data-depth="0"] .model-floor-shadow {
      transform: scale(1.15);
      opacity: 1;
    }

    .model-card[data-depth="-1"] {
      z-index: 5;
      transform: translateX(-195px) scale(0.80);
      opacity: 0.40;
      filter: blur(2px) grayscale(65%) brightness(0.95);
    }
    .model-card[data-depth="1"] {
      z-index: 5;
      transform: translateX(195px) scale(0.80);
      opacity: 0.40;
      filter: blur(2px) grayscale(65%) brightness(0.95);
    }

    .model-card[data-depth="-2"] {
      z-index: 3;
      transform: translateX(-355px) scale(0.70);
      opacity: 0.20;
      filter: blur(5px) grayscale(90%) brightness(0.90);
    }
    .model-card[data-depth="2"] {
      z-index: 3;
      transform: translateX(355px) scale(0.70);
      opacity: 0.20;
      filter: blur(5px) grayscale(90%) brightness(0.90);
    }

    .model-card[data-depth="-3"],
    .model-card[data-depth="3"] {
      z-index: 1;
      transform: translateX(0) scale(0.60);
      opacity: 0.05;
      filter: blur(7px) grayscale(100%);
    }

    .model-card[data-depth="hidden"] {
      z-index: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.5);
    }

    /* Badge flotante del look activo */
    .model-badge-tag {
      position: absolute;
      top: 10px;
      background: rgba(18, 18, 18, 0.90);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      padding: 5px 14px;
      border-radius: 20px;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }

    .model-card[data-depth="0"] .model-badge-tag {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================
       5. CURSOR PERSONALIZADO "DRAG"
    ========================================================= */
    .drag-cursor {
      position: fixed;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(18, 18, 18, 0.88);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      pointer-events: none;
      z-index: 200;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.22s var(--ease-smooth), opacity 0.22s ease;
      opacity: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .drag-cursor.visible {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .drag-cursor.grabbing {
      transform: translate(-50%, -50%) scale(0.85);
      background: #000000;
    }

    /* =========================================================
       6. BARRA DE PROGRESO Y CONTROLES INFERIORES
    ========================================================= */
    .carousel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding: 0 8px;
    }

    .carousel-nav-arrows {
      display: flex;
      gap: 10px;
    }

    .nav-arrow-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: #ffffff;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.25s var(--ease-smooth);
    }

    .nav-arrow-btn:hover {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
      transform: scale(1.05);
    }

    .nav-arrow-btn:active {
      transform: scale(0.95);
    }

    .progress-track-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      max-width: 320px;
      margin: 0 24px;
    }

    .progress-rail {
      flex: 1;
      height: 2px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 16.66%;
      background: var(--text-main);
      border-radius: 2px;
      transition: width var(--anim-time) var(--ease-smooth);
    }

    .progress-counter {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================
       7. PANEL LATERAL: "IN THIS LOOK"
    ========================================================= */
    .sidebar-column {
      display: flex;
      flex-direction: column;
    }

    .in-this-look-card {
      background: var(--card-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 30px 28px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.06);
      height: 100%;
      justify-content: space-between;
    }

    .look-header-meta {
      margin-bottom: 22px;
    }

    .look-micro-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    .look-headline {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-main);
    }

    /* Lista de 3 prendas del outfit activo */
    .look-products-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      margin-bottom: 24px;
    }

    .product-row-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(244, 244, 242, 0.65);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: transform 0.25s ease, background 0.25s ease;
      opacity: 0;
      transform: translateY(14px);
    }

    .product-row-item:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
    }

    /* Animación de entrada escalonada al cambiar de look */
    .product-row-item.anim-in {
      animation: itemFadeSlide 0.45s var(--ease-smooth) forwards;
    }
    .product-row-item:nth-child(1) { animation-delay: 40ms; }
    .product-row-item:nth-child(2) { animation-delay: 90ms; }
    .product-row-item:nth-child(3) { animation-delay: 140ms; }

    .product-thumb-box {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .product-thumb-box img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .product-info-box {
      flex: 1;
      min-width: 0;
    }

    .product-cat-pill {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: inline-block;
      margin-bottom: 3px;
    }

    .product-name-txt {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .product-size-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.05);
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
    }

    .product-price-txt {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    /* Resumen total y botón de compra */
    .look-footer-checkout {
      border-top: 1px solid var(--border-subtle);
      padding-top: 20px;
    }

    .outfit-total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .outfit-total-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .outfit-total-amount {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .add-to-bag-btn {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      background: var(--text-main);
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s var(--ease-smooth);
      position: relative;
      overflow: hidden;
    }

    .add-to-bag-btn:hover {
      background: #2a2a2a;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    .add-to-bag-btn:active {
      transform: translateY(0);
    }

    .add-to-bag-btn.added-state {
      background: #15803d;
    }

    /* Toast flotante de notificación */
    .cart-toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #121212;
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.4s var(--ease-smooth);
      z-index: 999;
    }

    .cart-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* =========================================================
       8. KEYFRAMES
    ========================================================= */
    @keyframes entranceHeader {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modelEntrance {
      from { opacity: 0; transform: translateY(45px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes itemFadeSlide {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =========================================================
       9. RESPONSIVE DESIGN
    ========================================================= */
    @media (max-width: 1100px) {
      .hero-layout {
        grid-template-columns: 1fr;
        padding: 0 24px 36px 24px;
        gap: 28px;
      }
      .site-nav {
        padding: 18px 24px;
      }
      .stage-column {
        min-height: 520px;
      }
      .sidebar-column {
        max-width: 600px;
        margin: 0 auto;
        width: 100%;
      }
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
      .hero-title {
        font-size: 28px;
      }
      .model-card[data-depth="-2"],
      .model-card[data-depth="2"] {
        display: none;
      }
      .model-card[data-depth="-1"] {
        transform: translateX(-130px) scale(0.78);
      }
      .model-card[data-depth="1"] {
        transform: translateX(130px) scale(0.78);
      }
      .progress-track-wrapper {
        margin: 0 12px;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       NAVEGACIÓN SUPERIOR
  ========================================================= -->
  <header class="site-nav">
    <a href="index.html" class="brand-logo" aria-label="Ir al inicio de Moda Casual">
      <span class="brand-dot"></span>
      MODA CASUAL
    </a>

    <nav aria-label="Navegación principal">
      <ul class="nav-links">
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="catalogo.html?cat=hombre">Caballeros</a></li>
        <li><a href="catalogo.html?cat=mujer">Damas</a></li>
        <li><a href="try-the-look.html" class="active">Try the Look</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

    <div class="nav-actions">
      <button type="button" class="bag-icon-btn" aria-label="Ver bolsa de compras" onclick="showToast('Bolsa de compras abierta')">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="bag-badge" id="bagCounter">0</span>
      </button>
    </div>
  </header>

  <!-- =========================================================
       HERO CONTAINER: TRY THE LOOK
  ========================================================= -->
  <main class="hero-layout" role="main">

    <!-- COLUMNA IZQUIERDA: CARRUSEL CENTRAL 3D -->
    <section class="stage-column" aria-label="Pasarela interactiva Try the Look">
      
      <!-- Encabezado superior izquierdo -->
      <div class="hero-header">
        <h1 class="hero-title">Try the Look.</h1>
        <p class="hero-subtitle">Arrastra para explorar, toca un look para ver las prendas.</p>
      </div>

      <!-- Escenario del carrusel interactivo -->
      <div class="carousel-stage" id="carouselStage"
           tabindex="0"
           role="region"
           aria-roledescription="carousel"
           aria-label="Carrusel de outfits Try the Look">

        <div class="stage-ambient-light"></div>

        <div class="carousel-track" id="carouselTrack" aria-live="polite">
          <!-- Modelos inyectados dinámicamente -->
        </div>

      </div>

      <!-- Barra de progreso y controles inferiores -->
      <div class="carousel-footer">
        
        <div class="carousel-nav-arrows">
          <button type="button" class="nav-arrow-btn" id="prevBtn" aria-label="Look anterior" onclick="navigateLook(-1)">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button type="button" class="nav-arrow-btn" id="nextBtn" aria-label="Siguiente look" onclick="navigateLook(1)">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <div class="progress-track-wrapper">
          <div class="progress-rail">
            <div class="progress-fill" id="progressFill"></div>

          <span class="progress-counter" id="progressCounter">01 / 06</span>
        </div>

        <div style="font-size: 11px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px;">
          <i class="fa-regular fa-hand-pointer"></i> Desliza o usa flechas
        </div>

      </div>

    </section>

    <!-- COLUMNA DERECHA: PANEL "IN THIS LOOK" -->
    <aside class="sidebar-column" aria-label="Prendas del look activo">
      <div class="in-this-look-card">

        </div>

        <!-- Lista de 3 prendas del outfit -->
        <ul class="look-products-list" id="productsList">

        </ul>

        <!-- Total y botón de compra -->
        <div class="look-footer-checkout">
          <div class="outfit-total-row">
            <span class="outfit-total-label">Total del outfit:</span>
            <span class="outfit-total-amount" id="outfitTotal">L. 1,450.00</span>
          </div>

          <button type="button" class="add-to-bag-btn" id="addToBagBtn" onclick="addOutfitToBag()">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>Add to bag</span>
          </button>
        </div>

      </div>
    </aside>

  </main>

  <!-- Cursor interactivo tipo burbuja "DRAG" -->

  <!-- Toast flotante de confirmación -->

    <i class="fa-solid fa-circle-check" style="color: #4ade80;"></i>
    <span id="toastMsg">Outfit agregado a la bolsa</span>
  </div>

  <!-- =========================================================

  ========================================================= */
  -->
  <script>
    /* =========================================================

    const LOOKS_DATA = [

      {

        products: [
          {

            image: "assets/cat.jpg"
          },
          {

            image: "assets/vino.png"
          },
          {

            size: "43",

            image: "assets/tal 2.png"
          }
        ]
      }
    ];

    /* =========================================================
       B. GENERADOR DEL MODELO 3D CON CAMISETA Y ESTAMPADO
    ========================================================= */
    function renderModelCardHTML(look, idx) {
      const shirtCol = look.shirtColor || "#171512";
      const isWhite = shirtCol.toLowerCase() === "#ffffff" || shirtCol.toLowerCase() === "#f8f9fa";
      const mainGraphic = (look.products && look.products[0] && look.products[0].image) || "assets/verd1.png";
      const uid = `m3d-${look.id}`;

      return `
        <div class="model-card anim-entrance"
             id="card-${idx}"
             data-index="${idx}"
             style="animation-delay: ${idx * 65}ms;"
             onclick="onCardClick(${idx})"
             tabindex="0"
             role="button"
             aria-label="Ver outfit ${look.title}">
          
          <span class="model-badge-tag"><i class="fa-solid fa-sparkles"></i> ${look.title}</span>
          
          <div class="model-figure-container">
            <!-- Modelo 3D Render Real -->
            <img src="assets/model-3d.webp" alt="${look.title}" class="model-3d-base-img">

            <!-- Camiseta DTF colocada directamente sobre el torso del modelo 3D -->
            <svg class="model-3d-tshirt-svg" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet">
              <defs>
                <clipPath id="clip-${uid}">
                  <path d="M 440 238 Q 512 280 584 238 L 664 254 L 712 376 L 648 402 L 626 360 L 632 494 Q 512 506 392 494 L 398 360 L 376 402 L 312 376 L 360 254 Z" />
                </clipPath>
                <linearGradient id="shade-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="${isWhite ? '0.35' : '0.18'}" />
                  <stop offset="50%" stop-color="#000000" stop-opacity="0" />
                  <stop offset="100%" stop-color="#000000" stop-opacity="${isWhite ? '0.12' : '0.36'}" />
                </linearGradient>
              </defs>

              <!-- Silueta de la camiseta sobre el torso con color dinámico -->
              <path class="model-3d-shirt-path"
                d="M 440 238 Q 512 280 584 238 L 664 254 L 712 376 L 648 402 L 626 360 L 632 494 Q 512 506 392 494 L 398 360 L 376 402 L 312 376 L 360 254 Z"
                fill="${shirtCol}"
                style="transition: fill 0.35s ease;"
              />

              <!-- Cuello acanalado de la playera -->
              <path d="M 440 238 Q 512 280 584 238 Q 512 292 440 238" fill="rgba(0,0,0,${isWhite ? '0.15' : '0.3'})"/>

              <!-- ESTAMPADO DTF DE LA CAMISA EN EL PECHO DEL MODELO 3D -->
              <g clip-path="url(#clip-${uid})">
                <image href="${mainGraphic}" x="420" y="285" width="184" height="175" preserveAspectRatio="xMidYMid contain" />
              </g>

              <!-- Sombreado realista del tejido de la camiseta -->
              <path d="M 440 238 Q 512 280 584 238 L 664 254 L 712 376 L 648 402 L 626 360 L 632 494 Q 512 506 392 494 L 398 360 L 376 402 L 312 376 L 360 254 Z"
                fill="url(#shade-${uid})"
                pointer-events="none"
              />

              <!-- Pliegues y arrugas suaves en sisa y torso -->
              <path d="M 398 360 Q 450 395 512 385" stroke="rgba(0,0,0,${isWhite ? '0.14' : '0.28'})" stroke-width="2.5" fill="none"/>
              <path d="M 626 360 Q 574 395 512 385" stroke="rgba(0,0,0,${isWhite ? '0.14' : '0.28'})" stroke-width="2.5" fill="none"/>
              <path d="M 392 485 Q 512 498 632 485" stroke="rgba(0,0,0,${isWhite ? '0.12' : '0.22'})" stroke-width="2" fill="none"/>
            </svg>
          </div>

          <div class="model-floor-shadow"></div>
        </div>
      `;
    }

    /* =========================================================
       C. ESTADO DEL CARRUSEL Y NAVEGACIÓN
    ========================================================= */
    let activeIndex = 0;
    const totalLooks = LOOKS_DATA.length;
    let bagTotalCount = 0;

    const trackEl = document.getElementById("carouselTrack");
    const stageEl = document.getElementById("carouselStage");
    const progressFillEl = document.getElementById("progressFill");
    const progressCounterEl = document.getElementById("progressCounter");
    const headlineEl = document.getElementById("lookHeadline");
    const productsListEl = document.getElementById("productsList");
    const outfitTotalEl = document.getElementById("outfitTotal");
    const dragCursorEl = document.getElementById("dragCursor");
    const bagCounterEl = document.getElementById("bagCounter");

    function initCarouselDOM() {
      trackEl.innerHTML = LOOKS_DATA.map((look, idx) => renderModelCardHTML(look, idx)).join("");
      updatePositions();
      updateSidebar(LOOKS_DATA[activeIndex]);
    }

    function updatePositions() {
      const cards = trackEl.querySelectorAll(".model-card");
      cards.forEach((card, idx) => {
        const diff = idx - activeIndex;
        if (diff === 0) {
          card.setAttribute("data-depth", "0");
        } else if (diff === -1) {
          card.setAttribute("data-depth", "-1");
        } else if (diff === 1) {
          card.setAttribute("data-depth", "1");
        } else if (diff === -2) {
          card.setAttribute("data-depth", "-2");
        } else if (diff === 2) {
          card.setAttribute("data-depth", "2");
        } else if (diff === -3) {
          card.setAttribute("data-depth", "-3");
        } else if (diff === 3) {
          card.setAttribute("data-depth", "3");
        } else {
          card.setAttribute("data-depth", "hidden");
        }
      });

      // Actualizar barra de progreso y contador
      const pct = ((activeIndex + 1) / totalLooks) * 100;
      progressFillEl.style.width = `${pct}%`;
      progressCounterEl.innerText = `${String(activeIndex + 1).padStart(2, '0')} / ${String(totalLooks).padStart(2, '0')}`;
    }

    function goToLook(idx) {
      if (idx < 0) idx = totalLooks - 1;
      if (idx >= totalLooks) idx = 0;
      if (idx === activeIndex) return;

      activeIndex = idx;
      updatePositions();
      updateSidebar(LOOKS_DATA[activeIndex]);
    }

    function navigateLook(delta) {
      goToLook(activeIndex + delta);
    }

    function onCardClick(idx) {
      if (isDragMoved) return;
      goToLook(idx);
    }

    /* =========================================================
       D. PANEL LATERAL: "IN THIS LOOK" CON ANIMACIÓN ESCALONADA
    ========================================================= */
    function updateSidebar(look) {
      if (!look) return;

      headlineEl.innerText = look.title;

      const totalAmount = look.products.reduce((acc, it) => acc + it.price, 0);
      outfitTotalEl.innerText = `L. ${totalAmount.toFixed(2)}`;

      productsListEl.innerHTML = look.products.map(p => `
        <li class="product-row-item anim-in">
          <div class="product-thumb-box">
            <img src="${p.image}" alt="${p.name}" onerror="this.src='assets/verd1.png'">
          </div>
          <div class="product-info-box">
            <span class="product-cat-pill">${p.category}</span>
            <h3 class="product-name-txt" title="${p.name}">${p.name}</h3>
            <span class="product-size-tag">Talla: ${p.size}</span>
          </div>
          <span class="product-price-txt">L. ${p.price.toFixed(2)}</span>
        </li>
      `).join("");
    }

    /* =========================================================
       E. FÍSICA DE ARRASTRE CON INERCIA Y SNAP
    ========================================================= */
    let isPointerDown = false;
    let isDragMoved = false;
    let startX = 0;
    let lastX = 0;
    let lastTimestamp = 0;
    let velocityX = 0;
    const DRAG_THRESHOLD = 45;

    stageEl.addEventListener("pointerdown", (e) => {
      isPointerDown = true;
      isDragMoved = false;
      startX = e.clientX;
      lastX = e.clientX;
      lastTimestamp = performance.now();
      velocityX = 0;
      stageEl.classList.add("is-dragging");
      dragCursorEl.classList.add("grabbing");
    });

    window.addEventListener("pointermove", (e) => {
      dragCursorEl.style.left = `${e.clientX}px`;
      dragCursorEl.style.top = `${e.clientY}px`;

      if (!isPointerDown) return;

      const currentX = e.clientX;
      const deltaX = currentX - lastX;
      const now = performance.now();
      const dt = now - lastTimestamp;

      if (dt > 0) {
        velocityX = deltaX / dt;
      }

      if (Math.abs(currentX - startX) > 8) {
        isDragMoved = true;
      }

      lastX = currentX;
      lastTimestamp = now;
    });

    window.addEventListener("pointerup", (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      stageEl.classList.remove("is-dragging");
      dragCursorEl.classList.remove("grabbing");

      const totalDeltaX = e.clientX - startX;

      // Inercia / velocidad o distancia excedida para snap al siguiente o anterior look
      if (Math.abs(velocityX) > 0.35 || Math.abs(totalDeltaX) > DRAG_THRESHOLD) {
        if (velocityX > 0.35 || totalDeltaX > DRAG_THRESHOLD) {
          navigateLook(-1);
        } else if (velocityX < -0.35 || totalDeltaX < -DRAG_THRESHOLD) {
          navigateLook(1);
        }
      }

      setTimeout(() => { isDragMoved = false; }, 50);
    });

    stageEl.addEventListener("mouseenter", () => {
      dragCursorEl.classList.add("visible");
    });
    stageEl.addEventListener("mouseleave", () => {
      dragCursorEl.classList.remove("visible");
    });

    /* =========================================================
       F. ACCESIBILIDAD Y TECLADO
    ========================================================= */
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") {
        navigateLook(-1);
      } else if (e.key === "ArrowRight") {
        navigateLook(1);
      }
    });

    /* =========================================================
       G. AGREGAR A LA BOLSA Y FEEDBACK
    ========================================================= */
    function addOutfitToBag() {
      const activeLook = LOOKS_DATA[activeIndex];
      bagTotalCount += activeLook.products.length;
      bagCounterEl.innerText = bagTotalCount;

      bagCounterEl.style.transform = "scale(1.4)";
      setTimeout(() => { bagCounterEl.style.transform = "scale(1)"; }, 250);

      const btn = document.getElementById("addToBagBtn");
      btn.classList.add("added-state");
      btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>¡Agregado a la bolsa!</span>';

      showToast(`Outfit "${activeLook.title}" agregado (${activeLook.products.length} prendas)`);

      setTimeout(() => {
        btn.classList.remove("added-state");
        btn.innerHTML = '<i class="fa-solid fa-bag-shopping"></i> <span>Add to bag</span>';
      }, 2000);
    }

    function showToast(msg) {
      const toast = document.getElementById("cartToast");
      const txt = document.getElementById("toastMsg");
      txt.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    // Inicializar al cargar
    document.addEventListener("DOMContentLoaded", () => {
      initCarouselDOM();
    });
  </script>
